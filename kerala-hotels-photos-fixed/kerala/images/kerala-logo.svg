<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE790"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(4, 6)">
    <!-- Outer Octagon / Rounded Seal -->
    <rect x="2" y="2" width="48" height="48" rx="14" fill="#0A261C" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <!-- Subtle Inner Glow Ring -->
    <circle cx="26" cy="26" r="19" stroke="url(#emeraldGrad)" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
    <!-- Kathakali / Lotus / Backwater Wave Crown Stylized Monogram -->
    <path d="M 26 12 C 22 17 18 22 18 28 C 18 34 22 38 26 39 C 30 38 34 34 34 28 C 34 22 30 17 26 12 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <path d="M 26 22 L 26 38" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="26" cy="18" r="2.2" fill="url(#goldGrad)"/>
    <path d="M 19 33 C 22 36 30 36 33 33" stroke="url(#goldGrad)" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Typography -->
  <text x="66" y="32" font-family="'Plus Jakarta Sans', 'Cinzel', 'Playfair Display', serif" font-size="20" font-weight="800" letter-spacing="4.5" fill="#FFFFFF">KERALA</text>
  <text x="180" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="3" fill="#D4AF37">ODYSSEY</text>
  <text x="67" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" letter-spacing="3.2" fill="#8EA397">GOD'S OWN COUNTRY · ESTD 2026</text>
</svg>
